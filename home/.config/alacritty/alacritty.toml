# Alacritty Configuration
# Managed by homeshick (dotfiles)

[window]
dimensions = { columns = 220, lines = 75 }
padding = { x = 8, y = 4 }
opacity = 0.85
# Note: macOS specific transparent decorations
decorations = "transparent"

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "HackGen Console NFJ", style = "Regular" }
bold = { family = "HackGen Console NFJ", style = "Bold" }
size = 14.0
offset = { y = 1 }

[bell]
# macOSの通知でベルを知らせる
command = { program = "osascript", args = ["-e", "display notification \"Bell rung in terminal\" with title \"Alacritty\""] }

# キーバインド
[[keyboard.bindings]]
key = "Comma"
mods = "Command"
command = { program = "sh", args = ["-c", "open ~/.config/alacritty/alacritty.toml"] }

[[keyboard.bindings]]
key = "Space"
mods = "Alt"
chars = " "

# delete word/line, moving, etc.
[[keyboard.bindings]]
key = "Back"
mods = "Super"
chars = "\u0015"

[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001bb"

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001bf"

# herdr 用に Command キーを解放 (ReceiveChar)
[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "W"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "K"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]

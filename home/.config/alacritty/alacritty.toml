action = "ReceiveChar"

[[keyboard.bindings]]
key = "Q"
mods = "Command"
action = "ReceiveChar"

# cmd+1〜9 を ReceiveChar で透過
[[keyboard.bindings]]
key = "Key1"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "Key2"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "Key3"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "Key4"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "Key5"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "Key6"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "Key7"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]
key = "Key8"
mods = "Command"
action = "ReceiveChar"

[[keyboard.bindings]]

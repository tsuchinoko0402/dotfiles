# herdr configuration
# Managed by homeshick (dotfiles)

[keys]
prefix = "ctrl+q"

# ワークスペース操作（cmd系）
new_workspace = "cmd+n"
new_worktree = "cmd+e"
switch_workspace = "cmd+1..9"
previous_workspace = "cmd+["
next_workspace = "cmd+]"
workspace_picker = "cmd+p"
goto = "cmd+g"
close_workspace = "cmd+d"

# エージェント間の移動
previous_agent = "cmd+k"
next_agent = "cmd+j"
open_notification_target = "cmd+o"
last_pane = "cmd+b"

# タブ・ペイン操作
new_tab = "cmd+t"
previous_tab = "shift+left"
next_tab = "shift+right"
switch_tab = "prefix+1..9"
close_pane = "cmd+w"
split_vertical = "cmd+ctrl+."
split_horizontal = "cmd+ctrl+,"
focus_pane_left = "cmd+ctrl+h"
focus_pane_down = "cmd+ctrl+j"
focus_pane_up = "cmd+ctrl+k"
focus_pane_right = "cmd+ctrl+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
resize_mode = "cmd+ctrl+r"

# コピーモード・スクロールバック
# ※ herdr でのコピーモード開始キーが copy_mode かどうかを検証
copy_mode = "cmd+y"
edit_scrollback = "prefix+e"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[ui]
copy_on_select = true
prompt_new_tab_name = false
agent_panel_sort = "priority"
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "herdr"

[experimental]
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]

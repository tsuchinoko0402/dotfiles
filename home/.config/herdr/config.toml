onboarding = false
# herdr configuration
# Managed by homeshick (dotfiles)

[keys]
prefix = "ctrl+q"

# ワークスペース操作
new_workspace = "ctrl+alt+n"
new_worktree = "ctrl+alt+e"
switch_workspace = "ctrl+alt+1..9"
previous_workspace = "ctrl+alt+["
next_workspace = "ctrl+alt+]"
workspace_picker = "ctrl+alt+p"
goto = "ctrl+alt+g"
close_workspace = "ctrl+alt+d"

# エージェント間の移動
previous_agent = "ctrl+alt+k"
next_agent = "ctrl+alt+j"
open_notification_target = "ctrl+alt+o"
last_pane = "ctrl+alt+b"

# タブ・ペイン操作
new_tab = "ctrl+alt+t"
previous_tab = "shift+left"
next_tab = "shift+right"
switch_tab = "prefix+1..9"
close_pane = "ctrl+alt+w"
split_vertical = "ctrl+alt+,"
split_horizontal = "ctrl+alt+."
resize_mode = "ctrl+alt+r"

# コピーモード・スクロールバック
copy_mode = "ctrl+alt+y"
edit_scrollback = "prefix+e"

[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"

[[keys.command]]
key = "prefix+alt+d"
type = "pane"
command = "hunk diff"

[[keys.command]]
key = "prefix+d"
type = "popup"
command = "hunk diff"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+s"
type = "popup"
command = "hunk show"
width = "80%"
height = "80%"

[ui]
copy_on_select = true
prompt_new_tab_name = false
agent_panel_sort = "priority"
hide_tab_bar_when_single_tab = true

[session]
resume_agents_on_restore = true

[ui.toast]
delivery = "herdr"

[experimental]
pane_history = false
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]
